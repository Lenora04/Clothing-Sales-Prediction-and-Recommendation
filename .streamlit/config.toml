[client]
# Disable telemetry to save bandwidth
sendDataMetrics = false

[logger]
# Reduce log verbosity
level = "error"

[theme]
# Dark theme runs lighter on the browser
primaryColor = "#667eea"
backgroundColor = "#f0f2f6"
secondaryBackgroundColor = "#ffffff"
textColor = "#262730"
font = "sans serif"

[server]
# Enable memory caching for faster reruns
maxUploadSize = 200
maxMessageSize = 200
enableCORS = false
enableXsrfProtection = true

[client.toolbars]
# Hide unnecessary elements
showSidebarNavigation = true
